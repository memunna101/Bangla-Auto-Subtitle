<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বাংলা Auto Subtitle Player</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0d1117;
  color:#fff;
  font-family:Arial,sans-serif
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:14px
}

.title{
  text-align:center;
  font-size:25px;
  font-weight:700;
  margin:8px 0 14px
}

.card{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px
}

video{
  width:100%;
  display:block;
  background:#000;
  border-radius:10px;
  max-height:58vh
}

.sub{
  min-height:48px;
  text-align:center;
  font-size:23px;
  font-weight:700;
  padding:9px;
  text-shadow:2px 2px 4px #000
}

input[type=file],
input[type=password]{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:8px;
  border:1px solid #444;
  background:#0d1117;
  color:#fff
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:13px;
  background:#238636;
  color:#fff;
  font-weight:700;
  font-size:17px;
  margin-top:12px
}

button:disabled{
  opacity:.5
}

.status{
  margin-top:10px;
  color:#bbb;
  line-height:1.5
}

.ok{color:#7ee787}
.err{color:#ff7b72}

.barbg{
  height:8px;
  background:#30363d;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden
}

.bar{
  height:100%;
  width:0;
  background:#2f81f7;
  transition:width .2s
}

pre{
  white-space:pre-wrap;
  font-size:12px;
  color:#bbb;
  max-height:220px;
  overflow:auto
}

.note{
  font-size:12px;
  color:#8b949e;
  line-height:1.5;
  margin-top:8px
}
</style>
</head>

<body>

<div class="wrap">

<div class="title">
🎬 বাংলা Auto Subtitle Player
</div>

<div class="card">

<video id="video" controls playsinline></video>

<div id="subtitle" class="sub">
বাংলা subtitle এখানে আসবে
</div>

</div>


<div class="card">

<b>🔑 Gemini API Key</b>

<input
  id="apiKey"
  type="password"
  placeholder="Gemini API Key এখানে দিন"
/>

<div class="note">
API key শুধু এই browser session-এ ব্যবহার হবে। কাউকে শেয়ার করবেন না।
</div>

<b style="display:block;margin-top:14px">
① ভিডিও নির্বাচন করুন
</b>

<input
  id="file"
  type="file"
  accept="video/*"
>

<button id="start">
🇧🇩 বাংলা Subtitle তৈরি করুন
</button>

<div class="barbg">
<div id="bar" class="bar"></div>
</div>

<div id="status" class="status">
API key এবং ভিডিও নির্বাচন করে বাটনে চাপুন।
</div>

</div>


<div class="card">

<b>AI-এর subtitle</b>

<pre id="result"></pre>

</div>

</div>


<script>

let selectedFile = null;
let cues = [];

const fileEl =
document.getElementById("file");

const video =
document.getElementById("video");

const sub =
document.getElementById("subtitle");

const status =
document.getElementById("status");

const bar =
document.getElementById("bar");

const result =
document.getElementById("result");

const btn =
document.getElementById("start");


fileEl.onchange = () => {

selectedFile = fileEl.files[0];

if (!selectedFile) return;

video.src =
URL.createObjectURL(selectedFile);

video.load();

const sizeGB =
selectedFile.size / 1024 / 1024 / 1024;

status.textContent =
`ভিডিও নেওয়া হয়েছে — ${sizeGB.toFixed(2)} GB`;

setBar(0);

result.textContent = "";

sub.textContent =
"বাংলা subtitle এখানে আসবে";

};


function setStatus(text,className=""){

status.className =
"status " + className;

status.textContent =
text;

}


function setBar(value){

bar.style.width =
Math.max(0,Math.min(100,value)) + "%";

}


function parseTime(value){

const match =
value.trim().match(
/(\d+):(\d{2}):(\d{2})[,.](\d{3})/
);

if(!match) return NaN;

return (
Number(match[1]) * 3600 +
Number(match[2]) * 60 +
Number(match[3]) +
Number(match[4]) / 1000
);

}


function parseSRT(text){

text =
text
.replace(/```srt/gi,"")
.replace(/```/g,"")
.trim();

const output=[];

const blocks =
text.split(/\r?\n\s*\r?\n/);

for(const block of blocks){

const lines =
block
.split(/\r?\n/)
.map(x=>x.trim())
.filter(Boolean);

const index =
lines.findIndex(
x=>x.includes("-->")
);

if(index < 0) continue;

const parts =
lines[index]
.split("-->")
.map(x=>x.trim());

if(parts.length !== 2) continue;

const start =
parseTime(parts[0]);

const end =
parseTime(parts[1]);

const subtitleText =
lines
.slice(index+1)
.join("\n");

if(
Number.isFinite(start) &&
Number.isFinite(end) &&
subtitleText
){

output.push({
start,
end,
text:subtitleText
});

}

}

return output;

}


video.addEventListener(
"timeupdate",
()=>{

const current =
cues.find(
item =>
video.currentTime >= item.start &&
video.currentTime <= item.end
);

sub.textContent =
current
? current.text
: "";

}
);


/* =========================
   GEMINI FILE UPLOAD
========================= */

async function uploadToGemini(
file,
apiKey
){

const base =
"https://generativelanguage.googleapis.com";


setStatus(
"⬆️ Gemini-তে ভিডিও upload শুরু হচ্ছে..."
);

setBar(5);


/*
STEP 1
Start resumable upload
*/

const startResponse =
await fetch(
`${base}/upload/v1beta/files?key=${encodeURIComponent(apiKey)}`,
{
method:"POST",

headers:{
"X-Goog-Upload-Protocol":"resumable",
"X-Goog-Upload-Command":"start",
"X-Goog-Upload-Header-Content-Length":
String(file.size),
"X-Goog-Upload-Header-Content-Type":
file.type || "video/mp4",
"Content-Type":
"application/json"
},

body:JSON.stringify({
file:{
display_name:
file.name
}
})
}
);


if(!startResponse.ok){

const errorText =
await startResponse.text();

throw new Error(
"Gemini upload শুরু করতে পারেনি: " +
errorText
);

}


/*
Gemini returns resumable upload URL
*/

const uploadUrl =
startResponse.headers.get(
"X-Goog-Upload-URL"
);


if(!uploadUrl){

throw new Error(
"Gemini upload URL পাওয়া যায়নি।"
);

}


setBar(10);


/*
STEP 2
Upload actual video
*/

const uploadResponse =
await fetch(
uploadUrl,
{
method:"POST",

headers:{
"Content-Length":
String(file.size),

"X-Goog-Upload-Offset":"0",

"X-Goog-Upload-Command":
"upload, finalize"
},

body:file
}
);


if(!uploadResponse.ok){

const errorText =
await uploadResponse.text();

throw new Error(
"Gemini video upload failed: " +
errorText
);

}


setBar(60);

setStatus(
"⏳ Gemini ভিডিও processing করছে..."
);


const uploadData =
await uploadResponse.json();


return uploadData.file;

}


/*
=========================
WAIT FOR GEMINI FILE
=========================
*/

async function waitForFile(
file,
apiKey
){

let current = file;

for(let i=0;i<120;i++){

const response =
await fetch(
`https://generativelanguage.googleapis.com/v1beta/${current.name}?key=${encodeURIComponent(apiKey)}`
);

if(!response.ok){

const text =
await response.text();

throw new Error(
"Gemini file status পাওয়া যায়নি: " +
text
);

}

current =
await response.json();

if(current.state === "ACTIVE"){

setBar(70);

return current;

}

if(current.state === "FAILED"){

throw new Error(
"Gemini ভিডিও processing করতে পারেনি।"
);

}

setStatus(
`⏳ Gemini ভিডিও processing করছে... ${Math.min(70 + i,90)}%`
);

setBar(
Math.min(70 + i * 0.15,90)
);

await new Promise(
resolve =>
setTimeout(resolve,3000)
);

}

throw new Error(
"Gemini processing করতে অনেক বেশি সময় লাগছে।"
);

}


/*
=========================
GENERATE SRT
=========================
*/

async function generateSubtitle(
file,
apiKey
){

setStatus(
"🤖 Gemini বাংলা subtitle তৈরি করছে..."
);

setBar(92);


const prompt = `

Analyze the speech/audio in this video.

Create accurate Bengali subtitles for ALL spoken dialogue.

Translate English, Hindi, or any other spoken language
into natural Bengali.

If the speech is already Bengali,
keep it natural Bengali.

Do not invent dialogue.

Synchronize every subtitle closely with the speech.

Return ONLY valid SRT format.

Example:

1
00:00:00,000 --> 00:00:02,000
বাংলা লেখা

2
00:00:02,000 --> 00:00:05,000
পরবর্তী বাংলা লেখা

Keep each subtitle short,
normally 1-2 lines.

Include timestamps throughout
the entire spoken portion.

`;


const response =
await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

contents:[

{
role:"user",

parts:[

{
text:prompt
},

{
file_data:{
file_uri:file.uri,
mime_type:file.mimeType
}
}

]

}

]

})
}
);


if(!response.ok){

const text =
await response.text();

throw new Error(
"Gemini subtitle error: " +
text
);

}


const data =
await response.json();


const text =
data?.candidates?.[0]?.content?.parts
?.map(part=>part.text || "")
.join("")
.trim();


if(!text){

throw new Error(
"Gemini কোনো subtitle ফেরত দেয়নি।"
);

}


return text;

}


/*
=========================
MAIN BUTTON
=========================
*/

btn.onclick =
async () => {

const apiKey =
document
.getElementById("apiKey")
.value
.trim();


if(!apiKey){

setStatus(
"❌ আগে Gemini API Key দিন।",
"err"
);

return;

}


if(!selectedFile){

setStatus(
"❌ আগে ভিডিও নির্বাচন করুন।",
"err"
);

return;

}


btn.disabled = true;

cues=[];

result.textContent="";

sub.textContent=
"প্রসেসিং...";

setBar(0);


try{


/*
1. Gemini upload
*/

const uploaded =
await uploadToGemini(
selectedFile,
apiKey
);


/*
2. Wait until ACTIVE
*/

const activeFile =
await waitForFile(
uploaded,
apiKey
);


/*
3. Generate Bengali SRT
*/

const srt =
await generateSubtitle(
activeFile,
apiKey
);


result.textContent =
srt;


cues =
parseSRT(srt);


if(!cues.length){

throw new Error(
"SRT subtitle পাওয়া যায়নি।"
);

}


setBar(100);

sub.textContent =
cues[0].text;


setStatus(
`✅ ${cues.length}টি বাংলা subtitle তৈরি হয়েছে। ভিডিও Play করুন।`,
"ok"
);


}
catch(error){

console.error(error);

setBar(0);

setStatus(
"❌ " +
(error.message ||
"কিছু একটা সমস্যা হয়েছে।"),
"err"
);

sub.textContent="";

}
finally{

btn.disabled=false;

}

};

</script>

</body>
</html>
